version: '3'

services:
  hkstock-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NODE_OPTIONS: --max-old-space-size=2048
    container_name: hkstock-app
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs:/var/log/nginx
    networks:
      - hkstock-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G

networks:
  hkstock-network:
    driver: bridge 