version: '3'

services:
  hkstock-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hkstock-app
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs:/var/log/nginx
    networks:
      - hkstock-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  hkstock-network:
    driver: bridge 