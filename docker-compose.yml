version: '3'

services:
  # 爬蟲服務和前端應用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hkstock-app
    image: hkstock-app:latest
    ports:
      - "3002:3002"
    restart: always
    volumes:
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production

  # Nginx服務（可選，用於更複雜的場景或SSL配置）
  # nginx:
  #   image: nginx:alpine
  #   container_name: hkstock-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - app
  #   restart: always

networks:
  default:
    driver: bridge 