server {
    listen 3001;
    server_name hkstock.atomtechnology.com.hk;

    # 設置較大的超時時間
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API代理配置
    location /jin10/ {
        # 標準寫法：去掉後斜線以避免路徑問題
        proxy_pass https://open-data-api.jin10.com;
        
        # 設置正確的頭信息
        proxy_set_header Host open-data-api.jin10.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header secret-key p7nYZHbya6PJtABF0ul_7;
        
        # 必須的SSL設置
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        
        # 請求路徑重寫
        rewrite ^/jin10/(.*) /$1 break;
        
        # 調試頭信息
        add_header X-Debug-Message "Jin10 API Proxy" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, secret-key" always;
        
        # 處理OPTIONS預檢請求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,secret-key';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
} 