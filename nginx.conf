server {
    listen 3001;
    server_name hkstock.atomtechnology.com.hk;

    # 設置較大的超時時間
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API代理配置
    location /jin10/ {
        # 標準寫法：去掉後斜線以避免路徑問題
        proxy_pass https://open-data-api.jin10.com;
        
        # 設置正確的頭信息
        proxy_set_header Host open-data-api.jin10.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header secret-key p7nYZHbya6PJtABF0ul_7;
        
        # 必須的SSL設置
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        
        # 請求路徑重寫
        rewrite ^/jin10/(.*) /$1 break;
        
        # 調試頭信息
        add_header X-Debug-Message "Jin10 API Proxy" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, secret-key" always;
        
        # 處理OPTIONS預檢請求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,secret-key';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
    
    # 富途要聞 API 代理配置
    location /futu/ {
        # 標準寫法：去掉後斜線以避免路徑問題
        proxy_pass https://news.futunn.com;
        
        # 設置正確的頭信息
        proxy_set_header Host news.futunn.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 使用移動設備的UA，更容易繞過反爬蟲
        proxy_set_header User-Agent 'Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 NewsArticle/11.0.1 FTWebView';
        proxy_set_header Referer 'https://www.futunn.com/';
        proxy_set_header Origin 'https://www.futunn.com';
        proxy_set_header Accept 'application/json, text/plain, */*';
        proxy_set_header Accept-Language 'zh-CN,zh;q=0.9,en;q=0.8';
        proxy_set_header Accept-Encoding 'gzip, deflate, br';
        
        # 重要：富途API需要這些Cookie
        proxy_set_header Cookie 'locale=zh-CN; device_id=web_SkzuDCzuE';
        
        # 增強安全性
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Pragma 'no-cache';
        proxy_set_header Cache-Control 'no-cache';
        
        # 必須的SSL設置
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        
        # 啟用請求體傳遞
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        
        # 設置較大的緩衝區
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # 調優超時設置
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        
        # 請求路徑重寫
        rewrite ^/futu/(.*) /$1 break;
        
        # 調試頭信息
        add_header X-Debug-Message "Futu API Proxy" always;
        add_header X-Original-Status $upstream_status always;
        add_header X-Original-Response-Time $upstream_response_time always;
        add_header X-Proxy-Host $proxy_host always;
        
        # CORS頭信息
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cookie" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # 啟用gzip壓縮
        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 6;
        gzip_types application/json text/plain;
        
        # 記錄訪問日誌
        access_log /var/log/nginx/futu_access.log;
        error_log /var/log/nginx/futu_error.log debug;
        
        # 處理OPTIONS預檢請求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Cookie';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
} 